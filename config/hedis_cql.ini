[oracle]
host=adb.us-phoenix-1.oraclecloud.com
port=1522
service=hediscql_tp
user=ADMIN
password_env=HEDIS_DB_PASSWORD
wallet_dir=wallet/
wallet_password_env=HEDIS_WALLET_PASSWORD

[execution]
thread_count=8
batch_size=25000
num_partitions=24
measurement_year=2026

[measures]
source=database
filesystem_path=measures/

[valuesets]
source=database
filesystem_path=valuesets/hedis_2026_valuesets.json

[logging]
level=INFO
log_dir=/var/log/hedis_cql
